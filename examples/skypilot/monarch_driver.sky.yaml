# Driver YAML for running Monarch with SkyPilot JobGroups as a managed job.
#
# The driver is a lightweight pod that launches the Monarch worker job group
# and coordinates training.
#
# API server options:
#   - Remote SkyPilot API server:  uncomment `api_access: true` below.
#     The API server injects credentials so this job can call sky.jobs.launch.
#   - Local API server (default):  omit api_access. SkyPilot auto-starts a
#     local API server inside this pod (see setup commands below).
#
# Usage:
#   sky jobs launch monarch_driver.sky.yaml
#
#   # CPU-only (no GPUs on workers):
#   sky jobs launch monarch_driver.sky.yaml --env GPUS_PER_HOST=0 --env ACCELERATOR=none
#
#   # Heterogeneous: GPU trainers + CPU dataloaders
#   sky jobs launch monarch_driver.sky.yaml --env NUM_DATALOADER_HOSTS=1
#
# Monitor:
#   sky jobs logs monarch-driver      # driver logs
#   sky jobs logs monarch-workers     # worker logs
#   sky jobs queue                    # status of all jobs
#
# Cancel everything:
#   sky jobs cancel monarch-driver
#   sky jobs cancel monarch-workers

name: monarch-driver

resources:
  cloud: kubernetes
  cpus: 2+
  image_id: docker:pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime

# Uncomment to use a remote SkyPilot API server (e.g., SkyPilot deployed on K8s).
# When omitted, a local API server is started inside this pod during setup.
# api_access: true

envs:
  NUM_HOSTS: 2           # Number of trainer nodes
  GPUS_PER_HOST: 1       # GPUs per trainer (0 = CPU only)
  ACCELERATOR: "H200:1"  # SkyPilot GPU spec (set to "none" for CPU-only)
  NUM_DATALOADER_HOSTS: 0  # Additional CPU-only dataloader nodes (0 = none)
  JOB_NAME: "monarch-workers"

workdir: .

setup: |
  set -ex

  echo "=== Installing system dependencies ==="
  apt-get update && apt-get install -y socat curl

  echo "=== Installing kubectl ==="
  curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  chmod +x kubectl && mv kubectl /usr/local/bin/
  kubectl version --client

  echo "=== Installing Python dependencies ==="
  uv pip install --system torchmonarch-nightly
  uv pip install --system "skypilot-nightly[kubernetes]"

  python -c "import monarch; print('Monarch OK')"
  python -c "import sky; print('SkyPilot OK')"

  # Start local SkyPilot API server.
  # If api_access: true is set and a remote server is configured, this is a no-op.
  unset SKYPILOT_IN_CLUSTER_CONTEXT_NAME
  sky api start

  echo "=== Verifying Kubernetes access ==="
  sky check kubernetes

  echo "=== Setup complete ==="

run: |
  echo "=== Monarch Driver: launching worker job group ==="
  echo "NUM_HOSTS=$NUM_HOSTS GPUS_PER_HOST=$GPUS_PER_HOST ACCELERATOR=$ACCELERATOR"

  DATALOADER_ARG=""
  if [ "$NUM_DATALOADER_HOSTS" -gt "0" ]; then
    DATALOADER_ARG="--num-dataloader-hosts $NUM_DATALOADER_HOSTS"
  fi

  python skypilot_quickstart_driver.py \
    --cloud kubernetes \
    --num-hosts "$NUM_HOSTS" \
    --gpus-per-host "$GPUS_PER_HOST" \
    --accelerator "$ACCELERATOR" \
    --job-name "$JOB_NAME" \
    $DATALOADER_ARG

  echo "=== Driver finished ==="
